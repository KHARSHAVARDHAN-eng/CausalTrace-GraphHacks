[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "causaltrace-backend"
version = "0.1.0"
description = "CausalTrace Backend - AI-Powered Incident Investigation Platform powered by FalkorDB"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "falkordb>=1.0.8",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
